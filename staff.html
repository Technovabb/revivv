<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff — Revivv Vehicle Detailing</title>
<meta name="description" content="Revivv staff console — today’s jobs and customers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F6F5F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Revivv">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" href="images/favicon.png">

<link rel="stylesheet" href="assets/css/site.css?v=18ab0384">
<link rel="stylesheet" href="assets/css/staff.css?v=18ab0384">
</head>
<body id="top" class="page-staff">





<header>
  <div class="wrap hd">
    <h1><a href="index.html" style="color:inherit;text-decoration:none">Revivv <span>· Staff</span></a></h1>
    <div class="hd-right" style="display:flex;align-items:center;gap:1.1rem"><a class="link" href="index.html">← Back to site</a><div id="hdRight"></div></div>
  </div>
</header>

<main class="wrap">

  <!-- sign in -->
  <section class="gate" id="gate">
    <h2>Staff sign in</h2>
    <p>Use the email and password set up for you in Supabase.</p>
    <input id="email" type="email" placeholder="your@email.com" autocomplete="username">
    <span class="pwrap">
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
      <button type="button" class="peye" id="staffEye" aria-label="Show password">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </span>
    <p class="msg" id="gateMsg"></p>
    <button class="btn btn-primary" id="gateBtn" style="width:100%">Sign in</button>
  </section>

  <!-- signed in -->
  <div id="board" class="hide">
    <div class="tabs">
      <button id="tabDay" class="on">Today's jobs</button>
      <button id="tabCust">Customers</button>
    </div>

  <!-- day view -->
  <section id="dayView">
    <div class="vtoggle">
      <button id="vDay" class="on">Day</button>
      <button id="vWeek">Week</button>
      <button id="vMonth">Month</button>
    </div>

    <div id="dayPane">
    <div class="daynav">
      <button id="prev" aria-label="Previous day">‹</button>
      <strong id="dayLabel">—</strong>
      <button class="today" id="todayBtn">Today</button>
      <button id="next" aria-label="Next day">›</button>
    </div>
    <input type="date" id="datePick">

    <div class="tally">
      <div><b id="tJobs">0</b>jobs</div>
      <div><b id="tDone">0</b>done</div>
      <div><b id="tMoney">$0</b>booked</div>
    </div>

    <div id="jobs"></div>
    </div>

    <div id="weekPane" class="hide">
      <div class="daynav">
        <button id="wPrev" aria-label="Previous week">‹</button>
        <strong id="wLabel">—</strong>
        <button class="today" id="wThis">This week</button>
        <button id="wNext" aria-label="Next week">›</button>
      </div>
      <div class="tally">
        <div><b id="wJobs">0</b>jobs</div>
        <div><b id="wDone">0</b>done</div>
        <div><b id="wMoney">$0</b>booked</div>
      </div>
      <div class="wgrid" id="wGrid"></div>
      <p class="empty" style="padding:1.2rem 0 0;font-size:.75rem">Tap a day or a job to open it.</p>
    </div>

    <div id="monthPane" class="hide">
      <div class="daynav">
        <button id="mPrev" aria-label="Previous month">‹</button>
        <strong id="mLabel">—</strong>
        <button class="today" id="mToday">This month</button>
        <button id="mNext" aria-label="Next month">›</button>
      </div>
      <div class="tally">
        <div><b id="mJobs">0</b>jobs</div>
        <div><b id="mDone">0</b>done</div>
        <div><b id="mMoney">$0</b>booked</div>
      </div>
      <div class="mgrid" id="mGrid"></div>
      <p class="empty" style="padding:1.2rem 0 0;font-size:.75rem">Tap any day to open it.</p>
    </div>
  </section>

  <!-- customers -->
  <section id="custView" class="hide">
    <input type="text" id="custSearch" placeholder="Search name, phone or email" style="margin-top:1.4rem">
    <div id="custList"></div>
  </section>
  </div>
</main>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/staff.js?v=18ab0384"></script>
<script>
(function(){
  var y = new Date().getFullYear();
  ['yr','yr2'].forEach(function(id){ var e = document.getElementById(id); if (e) e.textContent = y; });
  // phone menu: the Menu button opens the full page list
  var btn = document.querySelector('.menu-button'), hd = btn && btn.closest('header');
  if (btn && hd) {
    var setMenu = function(open){
      hd.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? 'Close' : 'Menu';
      document.body.classList.toggle('menu-open', open);
    };
    btn.addEventListener('click', function(){ setMenu(!hd.classList.contains('open')); });
    hd.querySelectorAll('nav a').forEach(function(a){ a.addEventListener('click', function(){ setMenu(false); }); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && hd.classList.contains('open')) { setMenu(false); btn.focus(); } });
    window.matchMedia('(min-width:901px)').addEventListener('change', function(e){ if (e.matches) setMenu(false); });
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js'); });
  }
})();
</script>
</body>
</html>
