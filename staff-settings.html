<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff — Revivv Vehicle Detailing</title>
<meta name="description" content="Revivv back office: prices, hours, closed days and emails.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F6F5F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Revivv">

<link rel="stylesheet" href="assets/css/site.css?v=e9fae307">
<link rel="stylesheet" href="assets/css/office.css?v=e9fae307">
</head>
<body id="top" class="page-staff page-office">




<style>
.jump{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.jump a{display:inline-flex;align-items:center;min-height:44px;padding:.4rem .95rem;border-radius:99px;background:var(--panel);
  border:1px solid var(--line);color:var(--muted);font-size:.8rem;font-weight:600;text-decoration:none}
.jump a:hover{border-color:var(--blue);color:var(--text)}
.page-office .card[id]{scroll-margin-top:130px}
.set-block{border-top:1px solid var(--line);padding:1rem 0 .4rem}
.set-block:first-of-type{border-top:none;padding-top:.2rem}
.set-block h3{font-size:1rem;font-weight:600;margin:0 0 .6rem;color:var(--text)}
.set-sub{font-family:var(--title);text-transform:uppercase;font-size:.85rem;letter-spacing:.03em;margin:1.4rem 0 .5rem;color:var(--text)}
.page-office .grid3.prices{grid-template-columns:repeat(3,minmax(0,1fr))}
.addon-line{display:flex;gap:.4rem 1rem;align-items:center;flex-wrap:wrap}
.addon-line .field{flex:1 1 140px;max-width:220px;margin-bottom:.4rem}
.addon-line .btn{margin-left:auto}
.checks{display:flex;gap:.2rem 1.4rem;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0 1rem}
.check{min-height:44px}
.closed-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-bottom:1px solid var(--line);padding:.5rem 0}
.save-row{border-top:1px solid var(--line);padding-top:.9rem}
.save-row .btn{flex:0 1 220px}
.msg.warn{color:var(--amber)}
.ok-line{color:var(--green);font-weight:600}
.card p + p{margin-top:.5rem}
</style>
<div id="office"><p class="loading">Loading…</p></div>






<script src="assets/js/api.js?v=e9fae307"></script>
<script src="assets/js/office.js?v=e9fae307"></script>
<script src="assets/js/office-settings.js?v=e9fae307"></script>
<script>
(function(){
  var y = new Date().getFullYear();
  ['yr','yr2'].forEach(function(id){ var e = document.getElementById(id); if (e) e.textContent = y; });
  // phone menu: the Menu button opens the full page list
  var btn = document.querySelector('.menu-button'), hd = btn && btn.closest('header');
  if (btn && hd) {
    var setMenu = function(open){
      hd.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? 'Close' : 'Menu';
      document.body.classList.toggle('menu-open', open);
    };
    btn.addEventListener('click', function(){ setMenu(!hd.classList.contains('open')); });
    hd.querySelectorAll('nav a').forEach(function(a){ a.addEventListener('click', function(){ setMenu(false); }); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && hd.classList.contains('open')) { setMenu(false); btn.focus(); } });
    window.matchMedia('(min-width:901px)').addEventListener('change', function(e){ if (e.matches) setMenu(false); });
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js'); });
  }
})();
</script>
</body>
</html>
