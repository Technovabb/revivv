<style>
  .t-row h3,.t-row .meta{overflow-wrap:anywhere}
  .t-row .left{min-width:0}
  .t-row .right{display:grid;gap:.3rem;justify-items:end}
  .t-link{font-family:ui-monospace,Consolas,monospace;font-size:.85rem !important;word-break:break-all;margin-bottom:.6rem}
  .t-roles{display:grid;gap:.45rem;font-size:.9rem;margin:0;padding:0;list-style:none}
  .t-roles b{color:var(--text)}
  .t-log{gap:.75rem}
  .t-log li{grid-template-columns:1fr;gap:.1rem}
  .t-log time{font-size:.72rem}
  @media(min-width:620px){.t-log li{grid-template-columns:10rem 1fr;gap:.8rem}.t-log time{font-size:.82rem}}
  .t-log .what{color:var(--text);font-weight:600}
  .t-log .detail{overflow-wrap:anywhere}
</style>
<div id="office"><p class="loading">Loading…</p></div>






<script src="assets/js/api.js?v=eeee17c9"></script>
<script src="assets/js/office.js?v=eeee17c9"></script>
<script src="assets/js/office-team.js?v=eeee17c9"></script>
<script>
(function(){
  var y = new Date().getFullYear();
  ['yr','yr2'].forEach(function(id){ var e = document.getElementById(id); if (e) e.textContent = y; });
  // phone menu: the Menu button opens the full page list
  var btn = document.querySelector('.menu-button'), hd = btn && btn.closest('header');
  if (btn && hd) {
    var setMenu = function(open){
      hd.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? 'Close' : 'Menu';
      document.body.classList.toggle('menu-open', open);
    };
    btn.addEventListener('click', function(){ setMenu(!hd.classList.contains('open')); });
    hd.querySelectorAll('nav a').forEach(function(a){ a.addEventListener('click', function(){ setMenu(false); }); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && hd.classList.contains('open')) { setMenu(false); btn.focus(); } });
    window.matchMedia('(min-width:901px)').addEventListener('change', function(e){ if (e.matches) setMenu(false); });
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js'); });
  }
})();
</script>
</body>
