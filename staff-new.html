<body id="top" class="page-staff page-office">




<style>
.page-office .check{text-transform:none;letter-spacing:0;font-weight:500;color:var(--text);min-height:44px}
.nb-form{max-width:720px}
.nb-picked{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;background:var(--raised);border-radius:10px;padding:.8rem .9rem;margin-bottom:.9rem}
.nb-picked h3{font-size:1rem;margin:0}
.nb-picked .meta{font-size:.8rem;color:var(--muted)}
.nb-results{display:grid;gap:.45rem;margin:-.3rem 0 .9rem}
.nb-results .item{padding:.7rem .9rem;min-height:44px}
.nb-results .item b{display:block;font-size:1rem;font-weight:600;color:var(--text)}
.nb-results .item .meta{display:block}
.nb-addon{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.nb-addon select{width:auto !important;flex:none}
.nb-warn{font-size:.85rem;color:var(--amber);margin:-.4rem 0 .8rem}
.nb-warn:empty{display:none}
.nb-or{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:.4rem 0 .6rem}
.nb-price{display:grid;gap:.3rem;font-size:.9rem}
.nb-price div{display:flex;justify-content:space-between;gap:1rem}
.nb-price div span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.nb-price .total{font-weight:700;font-size:1.1rem;border-top:1px solid var(--line);padding-top:.45rem;margin-top:.2rem}
.nb-price .off span:last-child{color:var(--green)}
</style>
<div id="office"><p class="loading">Loading…</p></div>






<script src="assets/js/api.js?v=435f48b3"></script>
<script src="assets/js/office.js?v=435f48b3"></script>
<script src="assets/js/office-new.js?v=435f48b3"></script>
<script>
(function(){
  var y = new Date().getFullYear();
  ['yr','yr2'].forEach(function(id){ var e = document.getElementById(id); if (e) e.textContent = y; });
  // phone menu: the Menu button opens the full page list
  var btn = document.querySelector('.menu-button'), hd = btn && btn.closest('header');
  if (btn && hd) {
    var setMenu = function(open){
      hd.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? 'Close' : 'Menu';
      document.body.classList.toggle('menu-open', open);
    };
    btn.addEventListener('click', function(){ setMenu(!hd.classList.contains('open')); });
    hd.querySelectorAll('nav a').forEach(function(a){ a.addEventListener('click', function(){ setMenu(false); }); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && hd.classList.contains('open')) { setMenu(false); btn.focus(); } });
    window.matchMedia('(min-width:901px)').addEventListener('change', function(e){ if (e.matches) setMenu(false); });
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js'); });
  }
})();
</script>
</body>
</html>
